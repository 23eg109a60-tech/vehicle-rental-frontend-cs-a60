services:
  - type: web
    name: vehicle-rental-frontend
    runtime: static
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://vehicle-rental-backend.onrender.com
    routes:
      - type: rewrite
        source: /api/*
        destination: https://vehicle-rental-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
